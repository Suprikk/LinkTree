<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linktree - Suprik</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hanzcode1/LinktreeBuilder@main/style.css">
   <script src="https://cdn.jsdelivr.net/gh/hanzcode1/LinktreeBuilder@main/script.js"></script>
</head>
<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading">
    <div class="loading-pixels">
      <div class="loading-pixel"></div>
      <div class="loading-pixel"></div>
      <div class="loading-pixel"></div>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app"></div>

  <script>
    Linktree.init({
    img: "Image Profile.png",
    nama: "Suprik",
    deskripsi: "Lagi Pengen Beli Siomay",
    medsos: [
        {
                "platform": "tiktok",
                "url": "https://www.tiktok.com/@sup_suprik"
        }
],
    links: [
        {
                "text": "SocialBuzz",
                "url": "https://sociabuzz.com/suprik_rill"
        }
],
    footer: "Kesatria sejati tidak akan berhenti walau Pedangnya terbakar oleh api"
    });
  </script>
</body>
</html>
